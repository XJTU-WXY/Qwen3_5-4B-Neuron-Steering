<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.5-4B · Neuron Steering</title>
<style>
:root{
  --bg:#fbfbfc; --panel:#ffffff; --panel-2:#f6f6f8; --line:#e6e6ec; --line-2:#d8d8e0;
  --ink:#15161a; --ink-2:#43454d; --muted:#82848f; --faint:#a9abb4;
  --accent:#4b4ee0; --accent-soft:#eeeefc;
  --up:#cf4436; --up-soft:#fdeeec; --down:#2a72c9; --down-soft:#eaf2fc;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:#dcdcfa}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.meta{display:flex;gap:6px;flex-wrap:wrap;overflow:hidden}
.chip{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--panel-2);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.chip.live{color:var(--accent);background:var(--accent-soft);border-color:#dcdcfb}
header .spacer{flex:1}
.hbtn{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);
  border-radius:7px;color:var(--ink-2);background:var(--panel);font-size:12.5px}
.hbtn:hover{background:var(--panel-2)}
.hbtn.on{border-color:#cfcffa;background:var(--accent-soft);color:var(--accent)}
.switch{width:26px;height:15px;border-radius:99px;background:var(--line-2);position:relative;transition:.16s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.hbtn.on .switch{background:var(--accent)}
.hbtn.on .switch::after{transform:translateX(11px)}

main{flex:1;display:flex;min-height:0}
aside{width:352px;flex:0 0 352px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;padding:14px 14px 20px;flex:1;min-height:0}
.sect{margin-bottom:18px}
.sect-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sect-title{font-size:11px;font-weight:650;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.linkbtn{font-size:11.5px;color:var(--muted);padding:1px 4px;border-radius:4px}
.linkbtn:hover{color:var(--ink);background:var(--panel-2)}

/* presets */
.pgroup{margin-bottom:9px}
.pgroup-name{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:5px}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
  color:var(--ink-2);line-height:1.5;transition:.12s}
.pchip:hover{border-color:var(--line-2);background:var(--panel-2)}
.pchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:550}

/* recipe rows */
.row{border:1px solid var(--line);border-radius:9px;padding:9px 10px 8px;margin-bottom:8px;background:var(--panel);
  transition:.12s}
.row.active{border-color:#cfcffa;box-shadow:0 0 0 3px #f4f4ff}
.row:hover{border-color:var(--line-2)}
.row-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.tag{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag input,.tag select{font-family:var(--mono);font-size:12.5px;color:var(--ink);border:1px solid var(--line);
  background:var(--panel-2);border-radius:5px;padding:2px 4px;width:58px;text-align:right}
.tag select{width:64px;text-align:left;appearance:none;padding-right:2px}
.tag input:focus,.tag select:focus{outline:none;border-color:var(--accent);background:#fff}
.iconbtn{width:22px;height:22px;border-radius:5px;color:var(--faint);display:grid;place-items:center;font-size:13px}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.row-head .grow{flex:1}
input[type=range]{-webkit-appearance:none;width:100%;height:16px;background:transparent;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--ink);margin-top:-4.5px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range].up::-webkit-slider-thumb{background:var(--up)}
input[type=range].down::-webkit-slider-thumb{background:var(--down)}
.row-meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:var(--mono);font-size:10.5px;
  color:var(--muted);white-space:nowrap}
.dose{font-weight:600;font-size:12px;min-width:44px}
.dose.up{color:var(--up)} .dose.down{color:var(--down)} .dose.zero{color:var(--faint)}
.addbtn{width:100%;border:1px dashed var(--line-2);border-radius:8px;padding:6px;color:var(--muted);
  font-size:12px;margin-top:2px}
.addbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.emptyhint{font-size:12px;color:var(--faint);padding:8px 2px}

/* calibration strip */
.strip{display:flex;align-items:flex-end;gap:2px;height:56px;padding:0 1px}
.bar{flex:1;background:#e4e4ee;border-radius:2px 2px 0 0;position:relative;cursor:pointer;transition:.12s;
  min-height:2px}
.bar:hover{background:var(--accent)}
.bar.sel{background:var(--accent)}
.bar.hi{background:#c3c3f4}
.strip-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--faint);margin-top:4px}
.strip-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* chat */
section.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.thread{flex:1;overflow-y:auto;padding:26px 0 8px}
.thread-inner{max-width:820px;margin:0 auto;padding:0 28px}
.hero{padding:8px 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.hero h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px;max-width:560px}
.hero .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sugg button{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;
  background:var(--panel);color:var(--ink-2)}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}

.turn{margin-bottom:26px}
.user-msg{display:flex;justify-content:flex-end;margin-bottom:12px}
.user-msg div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:8px 13px;max-width:76%;white-space:pre-wrap;word-break:break-word}
.responses{display:grid;gap:14px}
.responses.pair{grid-template-columns:1fr 1fr}
.responses.pair .resp + .resp{border-left:1px solid var(--line);padding-left:16px}
.resp{min-width:0}
.resp-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.rlabel{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.rlabel.base{color:var(--muted)}
.rlabel.steer{color:var(--accent)}
.rbadge{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.rbadge.up{color:var(--up);border-color:#f2d7d3;background:#fdf5f4}
.rbadge.down{color:var(--down);border-color:#d8e6f7;background:#f4f9fe}
.rstale{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.resp-body{word-break:break-word}
.resp-foot{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.resp-body p{margin:0 0 9px}
.resp-body p:last-child{margin-bottom:0}
.resp-body h1,.resp-body h2,.resp-body h3,.resp-body h4{font-size:14.5px;font-weight:650;margin:14px 0 6px}
.resp-body ul,.resp-body ol{margin:0 0 10px 20px}
.resp-body li{margin-bottom:3px}
.resp-body code{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:4px;padding:.5px 4px}
.resp-body pre{background:#f7f7fa;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  overflow-x:auto;margin:0 0 10px}
.resp-body pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.55}
.resp-body blockquote{border-left:2px solid var(--line-2);padding-left:10px;color:var(--ink-2);margin:0 0 10px}
.resp-body hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.think{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:10px;padding:0 10px}
.think summary{font-size:11.5px;color:var(--muted);cursor:pointer;padding:6px 0;font-family:var(--mono)}
.think div{font-size:12.5px;color:var(--ink-2);padding-bottom:8px;white-space:pre-wrap}
.caret{display:inline-block;width:6px;height:14px;background:var(--accent);vertical-align:-2px;
  animation:blink 1s steps(2) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}
.err{color:var(--up);font-size:12.5px;font-family:var(--mono);background:var(--up-soft);
  border:1px solid #f4d5d1;border-radius:7px;padding:7px 10px}

/* composer */
.composer{flex:0 0 auto;padding:10px 0 16px;background:linear-gradient(to bottom,rgba(251,251,252,0),var(--bg) 22%)}
.composer-inner{max-width:820px;margin:0 auto;padding:0 28px}
.box{border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:9px 10px 8px;
  box-shadow:0 1px 2px rgba(16,17,26,.04)}
.box:focus-within{border-color:#c9c9f7;box-shadow:0 0 0 3px #f2f2fd}
textarea{width:100%;border:none;resize:none;outline:none;background:none;max-height:180px;
  min-height:44px;line-height:1.55;padding:2px 2px 4px}
.box-foot{display:flex;align-items:center;gap:8px}
.box-foot .spacer{flex:1}
.send{height:30px;padding:0 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;
  font-weight:550;display:flex;align-items:center;gap:6px}
.send:hover{background:#2b2d35}
.send.stop{background:var(--up)}
.send:disabled{opacity:.45;cursor:default}
.tiny{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

/* settings popover */
.pop{position:absolute;top:46px;right:14px;width:262px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 28px rgba(16,17,26,.12);padding:12px;display:none;z-index:20}
.pop.open{display:block}
.pop .fld{margin-bottom:10px}
.pop label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.pop label b{font-family:var(--mono);color:var(--ink);font-weight:600}
.pop input[type=number]{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 7px;
  font-family:var(--mono);font-size:12px;background:var(--panel-2)}
.pop .check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.pop .check input{accent-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Qwen3.5-4B</b><span>neuron&nbsp;steering</span></div>
    <div class="meta" id="meta"></div>
    <div class="spacer"></div>
    <button class="hbtn" id="newChatBtn" title="清空对话上下文">新对话</button>
    <button class="hbtn" id="compareBtn" title="每条消息同时生成未干预与已干预两份回答">
      <span class="switch"></span>对照
    </button>
    <button class="hbtn" id="settingsBtn">设置</button>
  </header>

  <main>
    <aside>
      <div class="scroll">
        <div class="sect">
          <div class="sect-head"><span class="sect-title">预设</span></div>
          <div id="presets"></div>
        </div>

        <div class="sect">
          <div class="sect-head">
            <span class="sect-title">配方</span>
            <button class="linkbtn" id="clearBtn">清空</button>
          </div>
          <div id="rows"></div>
          <button class="addbtn" id="addBtn">+ 添加神经元</button>
        </div>

        <div class="sect" style="margin-bottom:8px">
          <div class="sect-head"><span class="sect-title">残差范数中位数</span></div>
          <div class="strip" id="strip"></div>
          <div class="strip-axis"><span>L0</span><span>L31</span></div>
          <div class="strip-note" id="stripNote"></div>
        </div>
      </div>
    </aside>

    <section class="chat">
      <div class="thread" id="thread">
        <div class="thread-inner">
          <div class="hero" id="hero">
            <h1>选一个神经元，然后说话。</h1>
            <p>干预只作用在推理时该层 MLP 的 down_proj 输入上，权重不动。</p>
            <div class="sugg" id="sugg"></div>
          </div>
          <div id="turnList"></div>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <div class="box">
            <textarea id="input" rows="1" placeholder="发消息…"></textarea>
            <div class="box-foot">
              <span class="tiny" id="recipeSummary"></span>
              <span class="spacer"></span>
              <span class="tiny" id="kbdHint">Enter 发送 · Shift+Enter 换行</span>
              <button class="send" id="sendBtn">发送</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="pop" id="pop">
  <div class="fld"><label>最大生成 token <b id="vMax">320</b></label>
    <input type="number" id="setMax" min="16" max="2048" step="16" value="320"></div>
  <div class="fld"><label>温度 <b id="vTemp">0.70</b></label>
    <input type="number" id="setTemp" min="0" max="1.5" step="0.05" value="0.7"></div>
  <div class="fld"><label>重复惩罚 <b id="vRep">1.05</b></label>
    <input type="number" id="setRep" min="1" max="1.5" step="0.01" value="1.05"></div>
  <label class="check"><input type="checkbox" id="setThink"> thinking 模式</label>
</div>

<script>
const S = {
  model: null,
  presets: [],
  recipe: [],
  rows: [],
  activeRow: 0,
  compare: false,
  sending: false,
  messages: [],
  detail: [],
  epoch: 0,
  settings: { max_new_tokens: 320, temperature: 0.7, repetition_penalty: 1.05, thinking: false },
};

const $ = (id) => document.getElementById(id);
const fmt = (n, d = 2) => Number(n).toFixed(d);
const signed = (n, d = 2) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(d);

/* ---------------- boot ---------------- */
init();

async function init() {
  buildStripPlaceholder();
  const res = await fetch("/api/state");
  const data = await res.json();
  S.model = data.model;
  S.presets = data.presets;
  renderMeta();
  renderPresets();
  renderSuggests();
  setRecipe([[14, 8949, 1.0], [13, 7956, -1.0]]);
  bindUI();
}

function renderMeta() {
  const m = S.model;
  const el = $("meta");
  el.innerHTML = "";
  const items = [
    `${m.num_layers} 层`,
    `${m.num_neurons.toLocaleString()} 神经元/层`,
    `${m.hidden_size} 维`,
    `${m.dtype}`,
    `${m.device}`,
  ];
  items.forEach((t) => {
    const s = document.createElement("span");
    s.className = "chip";
    s.textContent = t;
    el.appendChild(s);
  });
}

function renderPresets() {
  const host = $("presets");
  host.innerHTML = "";
  S.presets.forEach((group) => {
    const wrap = document.createElement("div");
    wrap.className = "pgroup";
    const name = document.createElement("div");
    name.className = "pgroup-name";
    name.textContent = group.group;
    wrap.appendChild(name);
    const chips = document.createElement("div");
    chips.className = "pchips";
    group.items.forEach((p) => {
      const b = document.createElement("button");
      b.className = "pchip";
      b.dataset.id = p.id;
      b.textContent = p.name;
      b.title = p.recipe.map((r) => `L${r[0]} N${r[1]} ${signed(r[2])}`).join("  ");
      b.onclick = () => {
        setRecipe(p.recipe.map((r) => [...r]));
        markPreset(p.id);
        if (p.probe) { $("input").value = p.probe; autoGrow(); $("input").focus(); }
      };
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    host.appendChild(wrap);
  });
}

function markPreset(id) {
  document.querySelectorAll(".pchip").forEach((c) => c.classList.toggle("on", c.dataset.id === id));
}

function renderSuggests() {
  const host = $("sugg");
  const list = ["Who are you?", "What do you think of humans?", "Write a four-line poem about the sea."];
  host.innerHTML = "";
  list.forEach((t) => {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => { $("input").value = t; autoGrow(); $("input").focus(); };
    host.appendChild(b);
  });
}

/* ---------------- strip ---------------- */
function buildStripPlaceholder() {
  const strip = $("strip");
  strip.innerHTML = "";
  for (let i = 0; i < 32; i++) {
    const b = document.createElement("div");
    b.className = "bar";
    b.style.height = "2px";
    strip.appendChild(b);
  }
}

function renderStrip() {
  const meds = S.model.medians;
  const max = Math.max(...meds);
  const strip = $("strip");
  strip.innerHTML = "";
  meds.forEach((v, i) => {
    const b = document.createElement("div");
    b.className = "bar" + (i === activeLayer() ? " sel" : "");
    b.style.height = Math.max(3, Math.pow(v / max, 0.55) * 100) + "%";
    b.title = `L${i} · 中位残差范数 ${fmt(v)}`;
    b.onclick = () => {
      const row = S.rows[S.activeRow];
      if (!row) return;
      row.item.layer = i;
      row.layerInput.value = i;
      refreshRow(row);
      refreshDerived();
    };
    strip.appendChild(b);
  });
  const pos = meds.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v);
  $("stripNote").textContent =
    `min L${pos[0].i} ${fmt(pos[0].v)} · max L${pos[pos.length - 1].i} ${fmt(pos[pos.length - 1].v)}`;
}

function activeLayer() {
  const row = S.rows[S.activeRow];
  return row ? row.item.layer : -1;
}

/* ---------------- recipe ---------------- */
function setRecipe(list) {
  S.recipe = list.map(([layer, neuron, dose]) => ({ layer, neuron, dose }));
  S.rows = [];
  S.activeRow = 0;
  const host = $("rows");
  host.innerHTML = "";
  if (!S.recipe.length) {
    const p = document.createElement("div");
    p.className = "emptyhint";
    p.textContent = "无干预，模型原样输出。";
    host.appendChild(p);
  }
  S.recipe.forEach((item, idx) => host.appendChild(makeRow(item, idx)));
  refreshDerived();
}

function makeRow(item, idx) {
  const row = document.createElement("div");
  row.className = "row";

  const head = document.createElement("div");
  head.className = "row-head";

  const tL = document.createElement("span");
  tL.className = "tag";
  tL.append("L");
  const layerInput = document.createElement("input");
  layerInput.type = "number";
  layerInput.min = 0;
  layerInput.max = S.model.num_layers - 1;
  layerInput.value = item.layer;
  tL.appendChild(layerInput);

  const tN = document.createElement("span");
  tN.className = "tag";
  tN.append("N");
  const neuronInput = document.createElement("input");
  neuronInput.type = "number";
  neuronInput.min = 0;
  neuronInput.max = S.model.num_neurons - 1;
  neuronInput.value = item.neuron;
  tN.appendChild(neuronInput);

  const dice = document.createElement("button");
  dice.className = "iconbtn";
  dice.textContent = "⟳";
  dice.title = "随机神经元";
  dice.onclick = () => {
    item.neuron = Math.floor(Math.random() * S.model.num_neurons);
    neuronInput.value = item.neuron;
    refreshDerived();
  };

  const del = document.createElement("button");
  del.className = "iconbtn";
  del.textContent = "×";
  del.title = "移除";
  del.onclick = () => {
    const next = S.recipe.filter((r) => r !== item);
    setRecipe(next.map((r) => [r.layer, r.neuron, r.dose]));
    markPreset(null);
  };

  const grow = document.createElement("span");
  grow.className = "grow";
  head.append(tL, tN, grow, dice, del);

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = -2; slider.max = 2; slider.step = 0.05;
  slider.value = item.dose;

  const meta = document.createElement("div");
  meta.className = "row-meta";
  const doseEl = document.createElement("span");
  doseEl.className = "dose";
  const alphaEl = document.createElement("span");
  const injEl = document.createElement("span");
  meta.append(doseEl, alphaEl, injEl);

  row.append(head, slider, meta);

  const handle = { item, row, layerInput, neuronInput, slider, doseEl, alphaEl, injEl };

  layerInput.oninput = () => {
    const v = Math.max(0, Math.min(S.model.num_layers - 1, Number(layerInput.value) || 0));
    item.layer = v;
    S.activeRow = S.rows.indexOf(handle);
    refreshDerived();
  };
  neuronInput.oninput = () => {
    const v = Math.max(0, Math.min(S.model.num_neurons - 1, Number(neuronInput.value) || 0));
    item.neuron = v;
    refreshDerived();
  };
  slider.oninput = () => {
    item.dose = Number(slider.value);
    refreshRow(handle);
    refreshDerived();
  };
  row.onfocusin = () => { S.activeRow = S.rows.indexOf(handle); row.classList.add("active"); };
  row.onfocusout = () => row.classList.remove("active");

  S.rows[idx] = handle;
  refreshRow(handle);
  return row;
}

function refreshRow(handle) {
  const d = handle.item.dose;
  handle.doseEl.textContent = signed(d);
  handle.doseEl.className = "dose " + (d > 0.001 ? "up" : d < -0.001 ? "down" : "zero");
  handle.slider.className = d > 0.001 ? "up" : d < -0.001 ? "down" : "";
  handle.layerInput.value = handle.item.layer;
  handle.neuronInput.value = handle.item.neuron;
}

let inspectTimer = null;
function refreshDerived() {
  renderStrip();
  clearTimeout(inspectTimer);
  inspectTimer = setTimeout(inspect, 120);
}

async function inspect() {
  const recipe = S.recipe.map((r) => [r.layer, r.neuron, r.dose]);
  if (!recipe.length) {
    S.detail = [];
    $("recipeSummary").textContent = "未干预";
    return;
  }
  const res = await fetch("/api/inspect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ recipe }),
  });
  const data = await res.json();
  S.detail = data.detail || [];
  S.detail.forEach((d, i) => {
    const row = S.rows[i];
    if (!row) return;
    row.alphaEl.textContent = `α ${signed(d.alpha)}`;
    row.injEl.textContent = `Δ ${fmt(Math.abs(d.dose), 2)}×resid`;
  });
  if (data.error) $("recipeSummary").textContent = data.error;
  else $("recipeSummary").textContent = summaryText();
}

function summaryText() {
  if (!S.recipe.length) return "未干预";
  return S.recipe
    .filter((r) => Math.abs(r.dose) > 0.001)
    .map((r) => `L${r.layer} N${r.neuron} ${signed(r.dose)}`)
    .join("  ") || "未干预";
}

/* ---------------- chat ---------------- */
function autoGrow() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(180, t.scrollHeight) + "px";
}

function bindUI() {
  const input = $("input");
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  $("sendBtn").onclick = () => (S.sending ? stop() : send());
  $("newChatBtn").onclick = newChat;
  $("addBtn").onclick = () => {
    setRecipe([...S.recipe.map((r) => [r.layer, r.neuron, r.dose]), [14, 0, 0.5]]);
    markPreset(null);
  };
  $("clearBtn").onclick = () => { setRecipe([]); markPreset(null); };
  $("compareBtn").onclick = () => {
    S.compare = !S.compare;
    $("compareBtn").classList.toggle("on", S.compare);
  };
  $("settingsBtn").onclick = () => $("pop").classList.toggle("open");
  const bind = (id, key, label, dec) => {
    $(id).oninput = () => {
      const v = Number($(id).value);
      if (Number.isNaN(v)) return;
      S.settings[key] = v;
      $(label).textContent = dec === 0 ? String(v) : v.toFixed(dec);
    };
  };
  bind("setMax", "max_new_tokens", "vMax", 0);
  bind("setTemp", "temperature", "vTemp", 2);
  bind("setRep", "repetition_penalty", "vRep", 2);
  $("setThink").onchange = (e) => { S.settings.thinking = e.target.checked; };
  document.addEventListener("click", (e) => {
    if (!$("pop").contains(e.target) && e.target.id !== "settingsBtn") $("pop").classList.remove("open");
  });
}

function newChat() {
  if (S.sending) stop();
  S.epoch += 1;
  S.sending = false;
  setSendingUI(false);
  S.messages = [];
  $("turnList").innerHTML = "";
  const hero = $("hero");
  if (hero) hero.style.display = "";
  $("thread").scrollTop = 0;
  $("input").focus();
}

function makeTurn(text) {
  const hero = $("hero");
  if (hero) hero.style.display = "none";
  const turn = document.createElement("div");
  turn.className = "turn";
  const user = document.createElement("div");
  user.className = "user-msg";
  const bubble = document.createElement("div");
  bubble.textContent = text;
  user.appendChild(bubble);
  const responses = document.createElement("div");
  responses.className = "responses" + (S.compare ? " pair" : "");
  turn.append(user, responses);
  $("turnList").appendChild(turn);
  return responses;
}

function makeResp(container, label, recipeText) {
  const resp = document.createElement("div");
  resp.className = "resp";
  const head = document.createElement("div");
  head.className = "resp-head";
  if (S.compare) {
    const l = document.createElement("span");
    l.className = "rlabel " + (label === "base" ? "base" : "steer");
    l.textContent = label === "base" ? "未干预" : "已干预";
    head.appendChild(l);
  }
  const badge = document.createElement("span");
  badge.className = "rbadge";
  if (label !== "base") {
    badge.textContent = recipeText || "未干预";
    head.appendChild(badge);
  }
  const body = document.createElement("div");
  body.className = "resp-body";
  const foot = document.createElement("div");
  foot.className = "resp-foot";
  resp.append(head, body, foot);
  container.appendChild(resp);
  return { resp, body, foot, badge };
}

async function send() {
  if (S.sending) return;
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  autoGrow();
  const epoch = S.epoch;
  S.messages.push({ role: "user", content: text });

  const recipeText = summaryText();
  const responses = makeTurn(text);
  scrollDown();

  const slots = {};
  const labels = S.compare && S.recipe.length ? ["base", "steer"] : ["single"];
  labels.forEach((lb) => {
    const badgeText = lb === "base" ? "未干预" : recipeText;
    slots[lb] = { ...makeResp(responses, lb, badgeText), text: "" };
  });

  S.sending = true;
  setSendingUI(true);

  const payload = {
    messages: S.messages,
    recipe: S.recipe.map((r) => [r.layer, r.neuron, r.dose]),
    ...S.settings,
    compare: S.compare && S.recipe.length > 0,
  };

  let finalText = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (epoch !== S.epoch) {
        reader.cancel();
        break;
      }
      buf += dec.decode(value, { stream: true });
      let at;
      while ((at = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, at);
        buf = buf.slice(at + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        handleEvent(ev, slots, labels);
        if (ev.type === "delta" && (ev.label === "single" || ev.label === "steer")) finalText += ev.text;
        if (ev.type === "delta") scrollDown();
      }
    }
  } catch (err) {
    const errEl = document.createElement("div");
    errEl.className = "err";
    errEl.textContent = String(err);
    responses.appendChild(errEl);
  }

  if (epoch !== S.epoch) return;
  S.sending = false;
  setSendingUI(false);
  if (finalText) S.messages.push({ role: "assistant", content: finalText });
  else S.messages.pop();
}

function handleEvent(ev, slots, labels) {
  if (ev.type === "begin") return;
  if (ev.type === "error") {
    const el = document.createElement("div");
    el.className = "err";
    el.textContent = ev.message;
    $("turnList").lastElementChild.querySelector(".responses").appendChild(el);
    return;
  }
  const slot = slots[ev.label];
  if (!slot) return;
  if (ev.type === "start") {
    if (ev.steering && ev.steering.length) {
      const net = ev.steering.reduce((a, d) => a + d.dose, 0);
      slot.badge.className = "rbadge" + (net > 0 ? " up" : net < 0 ? " down" : "");
      slot.badge.textContent = ev.steering.map((d) => `L${d.layer} N${d.neuron} ${signed(d.dose)}`).join("  ");
    }
    slot.promptTokens = ev.prompt_tokens;
  } else if (ev.type === "delta") {
    slot.text += ev.text;
    slot.body.innerHTML = renderMarkdown(slot.text) + '<span class="caret"></span>';
  } else if (ev.type === "end") {
    slot.body.innerHTML = renderMarkdown(slot.text);
    slot.foot.innerHTML = "";
    const parts = [
      `${ev.tokens} tok`,
      `${fmt(ev.seconds, 1)} s`,
      `${fmt(ev.tokens_per_second, 1)} t/s`,
      `prompt ${slot.promptTokens}`,
    ];
    if (ev.stopped) parts.push("已停止");
    parts.forEach((t) => {
      const s = document.createElement("span");
      s.textContent = t;
      slot.foot.appendChild(s);
    });
  }
}

function setSendingUI(on) {
  const b = $("sendBtn");
  b.textContent = on ? "停止" : "发送";
  b.classList.toggle("stop", on);
  b.disabled = false;
  $("input").disabled = on;
}

async function stop() {
  await fetch("/api/stop", { method: "POST" });
}

function scrollDown() {
  const t = $("thread");
  t.scrollTop = t.scrollHeight;
}

/* ---------------- markdown ---------------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function renderMarkdown(text) {
  let out = "";
  const thinkMatch = text.match(/^([\s\S]*?)<think>([\s\S]*?)(<\/think>|$)/);
  let main = text;
  if (thinkMatch && thinkMatch[1] === "") {
    const open = thinkMatch[3] === "</think>";
    out += `<details class="think"${open ? "" : " open"}><summary>思考</summary><div>${esc(
      thinkMatch[2]
    )}</div></details>`;
    main = text.slice(thinkMatch[0].length);
  }
  main = main.replace(/<\/?think>/g, "");

  const lines = esc(main).split("\n");
  let i = 0;
  let listType = null;
  const closeList = () => {
    if (listType) { out += `</${listType}>`; listType = null; }
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out += `<pre><code>${buf.join("\n")}</code></pre>`;
      continue;
    }
    if (/^\s*$/.test(line)) { closeList(); i++; continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { closeList(); out += "<hr>"; i++; continue; }
    if (/^\s*&gt;\s?/.test(line)) {
      closeList();
      out += `<blockquote>${inline(line.replace(/^\s*&gt;\s?/, ""))}</blockquote>`;
      i++; continue;
    }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? "ul" : "ol";
      if (listType !== want) { closeList(); out += `<${want}>`; listType = want; }
      out += `<li>${inline((ul || ol)[1])}</li>`;
      i++; continue;
    }
    closeList();
    const para = [line];
    i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(```|#{1,4}\s|[-*+]\s|\d+[.)]\s|&gt;)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out += `<p>${inline(para.join("<br>"))}</p>`;
  }
  closeList();
  return out;
}
